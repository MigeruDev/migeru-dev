name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    environment: staging

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Next.js App
        run: npm run build

      - name: Verify Environment Variables
        run: |
          echo "Variables available in CI:"
          echo "- NODE_ENV: ${NODE_ENV:-undefined}"
          echo "- CI: $CI (always true in GitHub Actions)"
          echo "- GITHUB_REF: $GITHUB_REF"
        env:
          API_KEY: ${{ secrets.API_KEY_RETAIL }}
